name: Bug or unexpected behavior
description: Tell us what failed so it can be reproduced and fixed.
title: "[Bug] "
assignees:
  - VincentRQ
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to document this. Do not include API keys, mailbox content, resumes, contact lists, or other private data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Find this in Setup under Help and maintenance.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Windows through WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the screen or workflow involved and the exact error shown.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Review the downloaded diagnostics before attaching them and remove private company, contact, or mailbox information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, resumes, contact lists, mailbox content, and other private data.
          required: true
