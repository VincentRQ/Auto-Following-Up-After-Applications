name: Release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTREACH_PUBLIC_SAMPLE_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:mcp
      - name: Verify MCP against the sample-safe backend
        run: |
          node backend/server.js &
          backend_pid=$!
          trap 'kill $backend_pid' EXIT
          npm run smoke:mcp
      - run: npm run pack:mcp
      - run: npm run audit:release
