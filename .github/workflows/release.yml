name: Release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTREACH_PUBLIC_SAMPLE_MODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:mcp
      - name: Verify MCP against the sample-safe backend
        run: |
          node backend/server.js &
          backend_pid=$!
          trap 'kill $backend_pid' EXIT
          npm run smoke:mcp
      - run: npm run pack:mcp
      - run: npm run audit:release
